name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload the SARIF results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff, zizmor and typos
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # No dependency's install script runs in a job that can write to code scanning.
      - name: Install markdownlint
        run: npm ci --ignore-scripts
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.2"
      - uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1
      - name: Install luacheck
        run: luarocks install luacheck 1.2.0
      # Dependabot doesn't track PowerShell Gallery modules, so these versions are updated by hand.
      - name: Install PSScriptAnalyzer and InjectionHunter
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module InjectionHunter -RequiredVersion 1.0.0 -Scope CurrentUser -Force
      # Dependabot doesn't track these downloads either, so each version and checksum is updated by hand.
      - name: Install gitleaks, actionlint and lua-language-server
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          LUALS_VERSION: 3.19.2
          LUALS_SHA256: 93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/luals"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP/bin" actionlint
          curl -sSfL -o luals.tar.gz "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          echo "${LUALS_SHA256}  luals.tar.gz" | sha256sum --check
          tar -xzf luals.tar.gz -C "$RUNNER_TEMP/luals"
          rm gitleaks.tar.gz actionlint.tar.gz luals.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - name: Lint and scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/lint.py --strict --sarif sarif
      # Code scanning isn't available to this repository while it's private, so the uploads wait until it's public.
      # The lint step above still fails the job on any finding.
      - name: Upload PSScriptAnalyzer results
        if: always() && !github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/psscriptanalyzer.sarif
          category: psscriptanalyzer
      - name: Upload zizmor results
        if: always() && !github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/zizmor.sarif
          category: zizmor
      - name: Upload gitleaks results
        if: always() && !github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/gitleaks.sarif
          category: gitleaks
